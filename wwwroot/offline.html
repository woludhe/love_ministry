<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1b4b" />
    <title>You're offline</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem calc(1.5rem + env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));
            box-sizing: border-box;
            background: linear-gradient(135deg, #0f0a2e 0%, #1e1b4b 50%, #312e81 100%);
            color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center;
        }
        .box { max-width: 340px; }
        img { width: 88px; height: 88px; border-radius: 20px; }
        h1 { font-size: 1.4rem; margin: 1.25rem 0 .5rem; }
        p { color: #c7d2fe; line-height: 1.5; margin: 0 0 1.5rem; }
        button {
            font: inherit; font-weight: 600; color: #1e1b4b; background: #fcf6ba;
            border: 0; border-radius: 999px; padding: .75rem 1.75rem; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="/apple-touch-icon.png" alt="" />
        <h1>You're offline</h1>
        <p>Check your internet connection, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
